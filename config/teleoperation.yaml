# Butter Finger Stage 0/1 input and Stage 2 IK dry-run configuration.
#
# The provisional workspace remains the Stage 1 input envelope for Stage 2.
# It is NOT a validated reachable workspace: dry-run IK separately reports
# convergence, and none of these values may be used to move an arm.

teleoperation:
  webcam:
    width: 640
    height: 480
    fps: 30
    mirror: true

  hand_tracking:
    num_hands: 2
    min_detection_confidence: 0.5
    min_presence_confidence: 0.5
    min_tracking_confidence: 0.5
    max_result_age_s: 0.15
    owner_match_distance: 0.25

  clutch:
    engage_ratio: 0.35
    release_ratio: 0.45
    debounce_frames: 3
    lost_timeout_s: 0.15

  mapping:
    gain_x_m: 0.12
    gain_y_m: 0.24
    gain_z_m: 0.20
    gain_pitch: 1.0

  filter:
    cutoff_hz: 3.0

  # Stage 2 is still dry-run only. These values make the pure-math solver and
  # diagnostic slew limiter deterministic; they are not measured hardware
  # safety limits and must not be forwarded to RaspberryPiArm.
  ik:
    anchor_pose: idle_ready
    end_effector: camera_link
    position_tolerance_m: 0.002
    pitch_tolerance_rad: 0.035
    orientation_weight_m_per_rad: 0.08
    min_forward_component: 0.2
    max_iterations: 80
    finite_difference_step_rad: 0.00001
    max_iteration_step_rad: 0.08
    initial_damping: 0.001
    min_damping: 0.000001
    max_damping: 0.1
    max_backtracking_steps: 6
    max_solution_jump_rad: 0.75
    max_slew_dt_s: 0.10
    joint_rate_limits_rad_s:
      base: 0.35
      shoulder: 0.35
      elbow: 0.35
      wrist: 0.35

  provisional_workspace:
    x_m: {min: 0.08, max: 0.26}
    y_m: {min: -0.14, max: 0.14}
    z_m: {min: 0.04, max: 0.24}
    pitch_rad: {min: -1.2, max: 0.8}
    initial_target:
      x_m: 0.18
      y_m: 0.0
      z_m: 0.14
      pitch_rad: 0.0
