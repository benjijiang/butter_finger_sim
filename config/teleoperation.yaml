# Butter Finger Stage 0/1 hand teleoperation configuration.
#
# These workspace values are only a virtual-target visualization envelope.
# They are NOT a validated reachable workspace and must not be used to move
# either the simulated or physical arm. Stage 2 will replace them with an
# FK/IK-derived workspace.

teleoperation:
  webcam:
    width: 640
    height: 480
    fps: 30
    mirror: true

  hand_tracking:
    num_hands: 2
    min_detection_confidence: 0.5
    min_presence_confidence: 0.5
    min_tracking_confidence: 0.5
    max_result_age_s: 0.15
    owner_match_distance: 0.25

  clutch:
    engage_ratio: 0.35
    release_ratio: 0.45
    debounce_frames: 3
    lost_timeout_s: 0.15

  mapping:
    gain_x_m: 0.12
    gain_y_m: 0.24
    gain_z_m: 0.20
    gain_pitch: 1.0

  filter:
    cutoff_hz: 3.0

  provisional_workspace:
    x_m: {min: 0.08, max: 0.26}
    y_m: {min: -0.14, max: 0.14}
    z_m: {min: 0.04, max: 0.24}
    pitch_rad: {min: -1.2, max: 0.8}
    initial_target:
      x_m: 0.18
      y_m: 0.0
      z_m: 0.14
      pitch_rad: 0.0
