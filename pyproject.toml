[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butter-finger-sim"
version = "0.1.0"
description = "Simplified PyBullet digital clone of the Butter Finger four-joint desktop robot arm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# PyBullet is only installed on the simulation machine (Linux primary, Mac fallback).
sim = [
    "pybullet>=3.2.5,<4",
    "Pillow>=12.3,<13",
    "opencv-contrib-python>=5,<6",
]
# MediaPipe 0.10.35 itself uses opencv-contrib-python. Declaring the same
# distribution here and in `sim` avoids installing both mutually-overlapping
# OpenCV wheels into one environment.
teleop = [
    "mediapipe>=0.10.35,<0.11",
    "opencv-contrib-python>=5,<6",
    "certifi>=2024.2.2",
]
voice = [
    "websocket-client>=1.7,<2",
    "sounddevice>=0.4.6,<1",
    "pocketsphinx>=5.0,<6",
]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
